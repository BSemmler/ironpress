name: C ABI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/**'
      - 'bindings/c/**'
      - 'bindings/cpp/**'
      - 'tests/fonts/NotoEmoji-TestSubset.ttf'
      - 'tests/parity/fonts/ParitySans.ttf'
      - 'scripts/bump-version.sh'
      - 'scripts/check-release-versions.sh'
      - '.github/workflows/c.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/**'
      - 'bindings/c/**'
      - 'bindings/cpp/**'
      - 'tests/fonts/NotoEmoji-TestSubset.ttf'
      - 'tests/parity/fonts/ParitySans.ttf'
      - 'scripts/bump-version.sh'
      - 'scripts/check-release-versions.sh'
      - '.github/workflows/c.yml'
  release:
    types: [published]

permissions:
  contents: read

env:
  CBINDGEN_VERSION: 0.29.4

jobs:
  contract:
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:2026.05.07-2@sha256:443eabd378e140996780a772e12c1a1ef10551da933fe76d74a1bab61f68a7b7
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-${{ runner.os }}-${{ runner.arch }}-${{ env.CBINDGEN_VERSION }}
      - name: Install the pinned header generator
        run: >-
          cbindgen --version 2>/dev/null
          | grep -qx "cbindgen ${CBINDGEN_VERSION}"
          || cargo install cbindgen --version "${CBINDGEN_VERSION}" --locked --force
      - name: Verify the committed C header
        run: bindings/c/generate-header.sh --check
      - name: Test the Rust boundary
        run: cargo test -p ironpress-ffi
      - name: Install native test tools
        run: dnf install -y cmake pkgconf-pkg-config valgrind
      - name: Compile and test the C consumer under Valgrind
        env:
          IRONPRESS_VALGRIND: '1'
        run: bindings/c/tests/run.sh
      - name: Test C++ ownership under Valgrind
        env:
          CXX: g++
          IRONPRESS_VALGRIND: '1'
        run: bindings/cpp/tests/run.sh
      - name: Compile and test the release library from C
        env:
          IRONPRESS_PROFILE: release
        run: bindings/c/tests/run.sh
      - name: Package the Linux x86_64 libraries
        run: bindings/c/package-unix.sh linux-x86_64
      - name: Test the packaged C++ consumer with GCC
        env:
          CXX: g++
        run: bindings/cpp/tests/verify-package.sh linux-x86_64
      - name: Test packaged CMake and pkg-config consumers
        run: bindings/c/tests/verify-package-metadata.sh linux-x86_64
      - name: Verify the glibc 2.28 compatibility floor
        run: bindings/c/verify-glibc-floor.sh target/release/libironpress_ffi.so 2.28
      - uses: actions/upload-artifact@v7
        with:
          name: ironpress-c-linux-x86_64
          path: dist/c/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64:2026.05.07-2@sha256:a435288af93def166dc59b5d052fa20ce59d76c6f38e8ad105767262d36843f0
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - name: Install native package test tools
        run: dnf install -y cmake pkgconf-pkg-config
      - name: Compile and test the release library from C
        env:
          IRONPRESS_PROFILE: release
        run: bindings/c/tests/run.sh
      - name: Package the Linux aarch64 libraries
        run: bindings/c/package-unix.sh linux-aarch64
      - name: Test the packaged C++ consumer with GCC
        env:
          CXX: g++
        run: bindings/cpp/tests/verify-package.sh linux-aarch64
      - name: Test packaged CMake and pkg-config consumers
        run: bindings/c/tests/verify-package-metadata.sh linux-aarch64
      - name: Verify the glibc 2.28 compatibility floor
        run: bindings/c/verify-glibc-floor.sh target/release/libironpress_ffi.so 2.28
      - uses: actions/upload-artifact@v7
        with:
          name: ironpress-c-linux-aarch64
          path: dist/c/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  macos-libraries:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            artifact: macos-x86_64
          - runner: macos-15
            artifact: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - name: Compile and test the release library from C
        env:
          IRONPRESS_PROFILE: release
        run: bindings/c/tests/run.sh
      - name: Package the native libraries
        run: bindings/c/package-unix.sh ${{ matrix.artifact }}
      - name: Test the packaged C++ consumer with Clang
        env:
          CXX: clang++
        run: bindings/cpp/tests/verify-package.sh ${{ matrix.artifact }}
      - name: Test packaged CMake and pkg-config consumers
        run: bindings/c/tests/verify-package-metadata.sh ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ironpress-c-${{ matrix.artifact }}
          path: dist/c/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows-library:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - name: Build the release library
        run: cargo build --release -p ironpress-ffi
      - name: Compile and test the release library from C
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c11 /utf-8 /W4 /WX /I bindings\c\include bindings\c\tests\smoke.c /Fe:target\ironpress-c-smoke.exe /link /LIBPATH:target\release ironpress_ffi.dll.lib
          set PATH=%CD%\target\release;%PATH%
          target\ironpress-c-smoke.exe tests\parity\fonts\ParitySans.ttf tests\fonts\NotoEmoji-TestSubset.ttf
      - name: Package the Windows x86_64 libraries
        shell: pwsh
        run: |
          $version = (Select-String -Path bindings/c/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $bundle = "ironpress-c-$version-windows-x86_64"
          $root = "dist/c/$bundle"
          New-Item -ItemType Directory -Force "$root/include/ironpress", "$root/lib/cmake/Ironpress" | Out-Null
          Copy-Item bindings/c/include/ironpress.h "$root/include/"
          Copy-Item bindings/cpp/include/ironpress.hpp "$root/include/"
          Copy-Item bindings/cpp/include/ironpress/* "$root/include/ironpress/" -Recurse
          Copy-Item bindings/c/ABI.md, bindings/c/README.md, LICENSE "$root/"
          Copy-Item bindings/cpp/README.md "$root/CPP.md"
          $packageRoot = (Resolve-Path $root).Path
          $cmakeSource = (Resolve-Path bindings/c/package/cmake).Path
          $cmakeOutput = (Resolve-Path "$root/lib/cmake/Ironpress").Path
          cmake "-DIRONPRESS_PACKAGE_SOURCE_DIR=$cmakeSource" "-DIRONPRESS_PACKAGE_OUTPUT_DIR=$cmakeOutput" "-DIRONPRESS_PACKAGE_ROOT=$packageRoot" "-DIRONPRESS_VERSION=$version" -P bindings/c/package/cmake/generate-package.cmake
          Copy-Item target/release/ironpress_ffi.dll, target/release/ironpress_ffi*.lib "$root/lib/"
          Compress-Archive -Path $root -DestinationPath "dist/c/$bundle.zip"
      - name: Test the packaged C++ consumer with MSVC
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          for /f "tokens=3" %%v in ('findstr /b /c:"version = " bindings\c\Cargo.toml') do set VERSION=%%~v
          set "BUNDLE=ironpress-c-%VERSION%-windows-x86_64"
          set "PACKAGE_ROOT=%RUNNER_TEMP%\ironpress-cpp-package"
          powershell -NoProfile -Command "Expand-Archive -Path 'dist/c/%BUNDLE%.zip' -DestinationPath '%PACKAGE_ROOT%'"
          set "ROOT=%PACKAGE_ROOT%\%BUNDLE%"
          cl /nologo /std:c++17 /permissive- /Zc:__cplusplus /EHsc /utf-8 /W4 /WX /I "%ROOT%\include" bindings\cpp\tests\smoke.cpp /Fe:target\ironpress-cpp-package-static-smoke.exe /link "%ROOT%\lib\ironpress_ffi.lib" kernel32.lib ntdll.lib userenv.lib ws2_32.lib dbghelp.lib
          target\ironpress-cpp-package-static-smoke.exe tests\parity\fonts\ParitySans.ttf tests\fonts\NotoEmoji-TestSubset.ttf
          cl /nologo /std:c++17 /permissive- /Zc:__cplusplus /EHsc /utf-8 /W4 /WX /I "%ROOT%\include" bindings\cpp\tests\smoke.cpp /Fe:target\ironpress-cpp-package-smoke.exe /link "%ROOT%\lib\ironpress_ffi.dll.lib"
          set "PATH=%ROOT%\lib;%PATH%"
          target\ironpress-cpp-package-smoke.exe tests\parity\fonts\ParitySans.ttf tests\fonts\NotoEmoji-TestSubset.ttf
      - name: Test packaged CMake consumers with MSVC
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          for /f "tokens=3" %%v in ('findstr /b /c:"version = " bindings\c\Cargo.toml') do set VERSION=%%~v
          set "BUNDLE=ironpress-c-%VERSION%-windows-x86_64"
          set "PACKAGE_ROOT=%RUNNER_TEMP%\ironpress-cmake-package"
          powershell -NoProfile -Command "Expand-Archive -Path 'dist/c/%BUNDLE%.zip' -DestinationPath '%PACKAGE_ROOT%'"
          set "ROOT=%PACKAGE_ROOT%\%BUNDLE%"
          set "PATH=%ROOT%\lib;%PATH%"
          cmake -S bindings\c\tests\package-consumers\c -B target\cmake-c-shared -DIRONPRESS_TEST_VERSION=%VERSION% -DIRONPRESS_TEST_TARGET=Ironpress::C -DCMAKE_PREFIX_PATH="%ROOT%"
          cmake --build target\cmake-c-shared --config Release
          target\cmake-c-shared\Release\ironpress_c_package_consumer.exe
          cmake -S bindings\c\tests\package-consumers\c -B target\cmake-c-static -DIRONPRESS_TEST_VERSION=%VERSION% -DIRONPRESS_TEST_TARGET=Ironpress::CStatic -DCMAKE_PREFIX_PATH="%ROOT%"
          cmake --build target\cmake-c-static --config Release
          target\cmake-c-static\Release\ironpress_c_package_consumer.exe
          cmake -S bindings\c\tests\package-consumers\cpp -B target\cmake-cpp-shared -DIRONPRESS_TEST_VERSION=%VERSION% -DIRONPRESS_TEST_TARGET=Ironpress::CXX -DCMAKE_PREFIX_PATH="%ROOT%"
          cmake --build target\cmake-cpp-shared --config Release
          target\cmake-cpp-shared\Release\ironpress_cpp_package_consumer.exe
          cmake -S bindings\c\tests\package-consumers\cpp -B target\cmake-cpp-static -DIRONPRESS_TEST_VERSION=%VERSION% -DIRONPRESS_TEST_TARGET=Ironpress::CXXStatic -DCMAKE_PREFIX_PATH="%ROOT%"
          cmake --build target\cmake-cpp-static --config Release
          target\cmake-cpp-static\Release\ironpress_cpp_package_consumer.exe
      - uses: actions/upload-artifact@v7
        with:
          name: ironpress-c-windows-x86_64
          path: dist/c/*.zip
          if-no-files-found: error
          retention-days: 1

  release-assets:
    if: github.event_name == 'release'
    needs: [contract, linux-aarch64, macos-libraries, windows-library]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ironpress-c-*
          path: dist
          merge-multiple: true
      - name: Write artifact checksums
        working-directory: dist
        run: sha256sum ironpress-c-* > SHA256SUMS
      - name: Attach C libraries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
