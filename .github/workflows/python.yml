name: Python Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  build-linux:
    name: Build wheels - Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        run: scripts/check-release-versions.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          working-directory: bindings/python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  build-macos:
    name: Build wheels - macOS ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        run: scripts/check-release-versions.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bindings/python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  build-windows:
    name: Build wheels - Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        run: scripts/check-release-versions.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          working-directory: bindings/python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: bindings/python/dist/*.whl

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        run: scripts/check-release-versions.sh
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: bindings/python/dist/*.tar.gz

  test-linux:
    name: Test wheel - Python ${{ matrix.python-version }}
    needs: [build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install the built wheel
        run: python -m pip install dist/ironpress-*-cp38-abi3-*.whl
      - name: Test the installed package
        run: python -m unittest discover -s bindings/python/tests -v

  test-sdist:
    name: Test source distribution
    needs: [sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: wheels-sdist
          path: dist
      - name: Install the source distribution
        run: python -m pip install dist/ironpress-*.tar.gz
      - name: Test the installed package
        run: python -m unittest discover -s bindings/python/tests -v

  publish:
    name: Publish to PyPI
    needs: [build-linux, build-macos, build-windows, sdist, test-linux, test-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        with:
          command: upload
          args: --skip-existing dist/*
