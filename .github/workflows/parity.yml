name: Parity Gate

# Deterministic visual-parity gate. Renders every fixture in-process, diffs it
# against COMMITTED browser oracle PDFs (no browser is launched here), and
# enforces the regression gate baked into the test. Then the reference-integrity
# check authenticates every fixture, oracle PDF, and renderer provenance against
# refs.lock. Oracle and candidate are rasterized by this job's same Poppler.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  parity-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: parity-cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}

      - name: Install poppler and deterministic fonts
        run: sudo apt-get update && sudo apt-get install -y jq poppler-utils fonts-noto-cjk fonts-liberation fonts-dejavu-core

      - name: Install bundled Parity fonts
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          cp tests/parity/fonts/Parity*.ttf "$HOME/.local/share/fonts/"
          fc-cache -f

      - name: Verify generated interaction product
        run: python3 scripts/generate-interaction-cartesian.py --check

      - name: Run parity test (committed PDF oracles)
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/parity/fonts/fonts.conf
          PARITY_PDFTOPPM: /usr/bin/pdftoppm
        run: scripts/parity.sh

      - name: Refs-freshness gate (refs.lock vs. current fixtures)
        if: always()
        run: scripts/parity-gen-refs.sh --check

      - name: Upload current parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-current-report
          if-no-files-found: warn
          retention-days: 14
          path: |
            tests/parity/REPORT.md
            tests/parity/report.json
            tests/parity/reports/
            tests/parity/refs/
            tests/parity/out/
            tests/parity/diffs/
