name: Deploy Playground

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'playground/**'
      - 'tests/parity/**'
      - 'tests/parity_support/**'
      - 'tests/feature_parity.rs'
      - 'scripts/parity*.sh'
      - 'Cargo.toml'
      - '.github/workflows/playground.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: playground-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}

      - name: Install build tools
        run: |
          command -v wasm-pack || cargo install wasm-pack
          scripts/parity-install-runtime.sh

      - name: Build playground
        run: |
          wasm-pack build --target web --features wasm --no-default-features
          cp pkg/ironpress.js playground/
          cp pkg/ironpress_bg.wasm playground/

      - name: Build feature parity report
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/parity/fonts/fonts.conf
          PARITY_PDFTOPPM: /usr/bin/pdftoppm
        run: scripts/parity.sh

      - name: Stage feature parity report
        run: |
          mkdir -p playground/parity
          cp -R tests/parity/reports playground/parity/
          cp -R tests/parity/refs playground/parity/
          cp -R tests/parity/out playground/parity/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground
      - id: deployment
        uses: actions/deploy-pages@v4
