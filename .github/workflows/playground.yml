name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'site/**'
      - 'playground/**'
      - 'tests/parity/**'
      - 'tests/parity_support/**'
      - 'tests/feature_parity.rs'
      - 'scripts/parity*.sh'
      - 'scripts/check-site.mjs'
      - 'scripts/build-font-packs.sh'
      - 'scripts/test-wasm-font-packs.mjs'
      - 'font-packs/**'
      - 'Cargo.toml'
      - '.github/workflows/playground.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate static site
        run: node scripts/check-site.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: playground-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}

      - name: Cache parity runtime downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/ironpress/parity-runtime
          key: parity-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/parity-install-runtime.sh') }}

      - name: Install build tools
        timeout-minutes: 15
        run: |
          command -v wasm-pack || cargo install wasm-pack
          scripts/parity-install-runtime.sh

      - name: Build playground
        run: wasm-pack build --target web --features wasm --no-default-features

      - name: Build optional font packs
        run: scripts/build-font-packs.sh dist/font-packs

      - name: Validate published font packs through WASM
        run: node scripts/test-wasm-font-packs.mjs dist/font-packs

      - name: Build feature parity report
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/parity/fonts/fonts.conf
          PARITY_PDFTOPPM: /usr/bin/pdftoppm
        run: scripts/parity.sh

      - name: Stage website
        run: |
          mkdir -p site-build/playground site-build/parity
          cp -R site/. site-build/
          cp playground/index.html site-build/playground/
          cp pkg/ironpress.js pkg/ironpress_bg.wasm site-build/playground/
          cp -R dist/font-packs site-build/playground/
          cp playground/parity/index.html site-build/parity/
          cp -R tests/parity/reports site-build/parity/
          cp -R tests/parity/refs site-build/parity/
          cp -R tests/parity/out site-build/parity/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-build
      - id: deployment
        uses: actions/deploy-pages@v4
