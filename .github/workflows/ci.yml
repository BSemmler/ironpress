name: CI

on:
  workflow_dispatch:
    inputs:
      publish_crate:
        description: Publish the crate from main after all required checks pass
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Restrict default permissions to read-only for all jobs.
# Jobs that need more (benchmarks, publish) override below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_PACK_VERSION: 0.15.0

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify package versions
        run: scripts/check-release-versions.sh

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate static site
        run: node scripts/check-site.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system fonts for Unicode rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji fonts-dejavu
      - run: cargo test --verbose
      - run: cargo test --verbose --features remote

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          targets: wasm32-unknown-unknown
      - run: cargo check --all-features
      - run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: clippy
      - run: cargo clippy -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ env.WASM_PACK_VERSION }}
      - name: Install the pinned wasm-pack release
        run: |
          wasm-pack --version 2>/dev/null \
            | grep -qx "wasm-pack ${WASM_PACK_VERSION}" \
            || cargo install wasm-pack \
              --version "${WASM_PACK_VERSION}" --locked --force
      - run: scripts/build-wasm-package.sh
      - run: node scripts/test-wasm-font-packs.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-package
          path: pkg
          retention-days: 1

  node-package:
    runs-on: ubuntu-latest
    needs: wasm
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: wasm-package
          path: pkg
      - run: node scripts/test-node-package.mjs

  python-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          manylinux: auto
          working-directory: bindings/python
      - name: Install the built wheel
        run: python -m pip install bindings/python/dist/ironpress-*-cp38-abi3-*.whl
      - name: Test the installed package
        run: python -m unittest discover -s bindings/python/tests -v

  ruby-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: bindings/ruby
      - name: Compile and test the native extension
        working-directory: bindings/ruby
        run: bundle exec rake

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-v1
      - run: command -v cargo-fuzz || cargo install cargo-fuzz
      - run: |
          for target in fuzz_html fuzz_css fuzz_markdown fuzz_full_pipeline fuzz_svg fuzz_table_flex; do
            echo "=== Fuzzing $target for 30s ==="
            cargo fuzz run "$target" -- -max_total_time=30
          done

  publish-npm:
    runs-on: ubuntu-latest
    needs: [release-metadata, test, msrv, clippy, fmt, node-package, python-bindings, ruby-bindings]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v8
        with:
          name: wasm-package
          path: pkg
      - name: Publish npm package
        working-directory: pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${package}@${version}" version >/dev/null 2>&1; then
            echo "${package}@${version} is already published"
          else
            npm publish --access public
          fi

  publish-crate:
    runs-on: ubuntu-latest
    needs: [release-metadata, test, msrv, clippy, fmt, python-bindings, ruby-bindings]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.publish_crate)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ironpress") | .version')"
          # Force the remote lookup; otherwise Cargo resolves the checked-out package.
          if cargo info --registry crates-io "ironpress@${version}" >/dev/null 2>&1; then
            echo "ironpress@${version} is already published"
          else
            cargo publish
          fi

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: tarpaulin-${{ runner.os }}-v2
      - run: command -v cargo-tarpaulin || cargo install cargo-tarpaulin
      - run: cargo tarpaulin --lib --out xml --output-dir ./default-cov --skip-clean
      - run: cargo tarpaulin --lib --out xml --output-dir ./remote-cov --skip-clean --features remote
      - uses: codecov/codecov-action@v7
        with:
          files: ./default-cov/cobertura.xml,./remote-cov/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
