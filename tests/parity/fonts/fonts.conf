<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Deterministic fontconfig for the ironpress feature-parity engine.

  Purpose: expose the bundled Parity families and deterministic fallbacks to
  fontconfig-aware oracle producers. The currently pinned snap Chromium resolves
  CSS generic families through its confined host-font view instead of these
  aliases; the generator therefore hashes those actual generic/CJK font files
  separately, and the candidate registers the same physical faces.

  The three bundled faces (ParitySans/ParitySerif/ParityMono) are copies of
  DejaVu Sans / DejaVu Serif / DejaVu Sans Mono whose INTERNAL family names have
  been renamed to ParitySans / ParitySerif / ParityMono (name table IDs 1/4/6/16).
  Because the internal names now match the file names, both Chrome and ironpress
  resolve font-family:ParitySans (etc.) to the exact same physical outline, with
  no dependence on any system font.

  Used by scripts/parity-gen-refs.sh via FONTCONFIG_FILE pointing here.
-->
<fontconfig>
  <!-- Prefer the bundled faces from this config directory. The old absolute
       developer checkout path did not exist in CI; relative keeps any checkout
       path working, while the user font dir covers refs generated by Chromium
       after scripts/parity-gen-refs.sh installs Parity*.ttf there. -->
  <dir prefix="relative">.</dir>
  <dir>~/.local/share/fonts</dir>
  <!-- CI installs fonts-noto-cjk here. Keep the directory narrow so Latin text
       remains on the deterministic Parity faces, while CJK glyphs fall back to
       real outlines instead of tofu when ParitySans/Serif/Mono have no glyph. -->
  <dir>/usr/share/fonts/opentype/noto</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <!-- Private cache dir so a stale OS cache cannot shadow our faces. -->
  <cachedir>/tmp/ironpress-parity-fontcache</cachedir>

  <!-- CSS generic families -> bundled faces.

       We use explicit <match target="pattern"> rules with a strong "prepend"
       instead of <alias><prefer>. Under FONTCONFIG_FILE the system generic
       config (45/49/60-*.conf) is still consulted and inserts a STRONG-bound
       "sans"/"serif"/"monospace" family ahead of any weak alias we add. For
       clients that honor this config, prepending our face with strong binding
       makes it sort first regardless of system rules. -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>ParitySans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>ParitySans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>ParitySerif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>ParityMono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>ParityMono</string></edit>
  </match>

  <!-- Map the original DejaVu names onto the bundled faces too, so any fixture or
       CSS that still references DejaVu resolves to the identical outline. -->
  <alias binding="same">
    <family>DejaVu Sans</family>
    <prefer><family>ParitySans</family></prefer>
    <default><family>ParitySans</family></default>
  </alias>
  <alias binding="same">
    <family>DejaVu Serif</family>
    <prefer><family>ParitySerif</family></prefer>
    <default><family>ParitySerif</family></default>
  </alias>
  <alias binding="same">
    <family>DejaVu Sans Mono</family>
    <prefer><family>ParityMono</family></prefer>
    <default><family>ParityMono</family></default>
  </alias>

  <!-- Last-resort fallback: any pattern that did not match one of the bundled
       faces gets ParitySans appended as its weak default, so an unknown
       family (e.g. Arial) resolves to the sans face just like Chrome's
       sans-serif default rather than to an arbitrary bundled file. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak"><string>ParitySans</string></edit>
  </match>

  <!-- CJK fallback. The bundled DejaVu-derived Parity faces intentionally keep
       Latin parity tight but do not contain CJK glyphs. Add Noto CJK after the
       Parity faces so CJK fixtures render real glyphs in CI instead of tofu,
       providing real fallback outlines without perturbing Latin-family
       selection. The snap oracle's actual CJK TTC is authenticated separately. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>
</fontconfig>
