<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 264px 136px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
    overflow: clip;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 264px;
    padding: 12px;
    overflow: clip;
    background: #fff;
  }
  .box {
    width: 150px;
    font-size: 20px;
    line-height: 28px;
    text-wrap-mode: nowrap;
    background: #fce4ec;
    border: 2px solid #ad1457;
  }
</style>
</head>
<body>
  <div class="box">This phrase must not wrap</div>
</body>
</html>
