<!doctype html>
<!--
  Standards-derived print oracle for clip-mask x paged-media.

  CSS Fragmentation 3 sections 2.1 and 5.5 make content overflowing a
  fixed-size box a parallel flow and apply graphical effects per fragment. The
  effect origin of an overflow-only fragment is the empty zero-margin,
  zero-border, zero-padding box at the fragmentainer start. CSS Masking 1
  section 5.1 uses the border box as the default reference box for this
  percentage polygon(), so its block-axis extent is zero and the overflowing
  child is fully clipped on page 3.

  Chromium 150 instead reuses the original 96px box as the page-3 clip-path
  reference and visibly paints that child. This source omits only that fully
  clipped overflow child. The surrounding boxes and all three forced page
  placements remain unchanged, materializing the specified raster without
  copying, transforming, or post-processing either comparison image.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>clip-mask x paged-media interaction — standards-derived reference</title>
<style>
  @page { size: 192px 200px; margin: 0; }

  @font-face {
    font-family: MatrixSans;
    src: url('../../fonts/ParitySans.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
  }
  html { font-family: ParitySans; font-size: 16px; line-height: 1.2; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #ffffff; }
  body { padding: 16px; color: #17324d; font-size: 0; white-space: nowrap; }
  .stage {
    display: inline-flex;
    width: 156px;
    height: 164px;
    margin-right: 8px;
    align-items: center;
    justify-content: center;
    background: #f7fafc;
    border: 1px solid #cbd5e1;
    font-size: 16px;
    vertical-align: top;
  }
  .stage:last-child { margin-right: 0; }
  .node {
    width: 126px;
    height: 68px;
    padding: 7px;
    border: 2px solid #577590;
    background-color: #e7f5ff;
    color: #17324d;
  }
  .node.inner {
    width: 58px;
    height: 48px;
    padding: 5px;
  }
  .node.outer { height: 96px; }
  .own { height: 22px; white-space: nowrap; }
  .asset { display: none; width: 34px; height: 24px; object-fit: cover; object-position: 70% 50%; }
  .f-generated-content::before { content: '‹'; color: #d62828; font-weight: 700; }
  .f-generated-content::after { content: '›'; color: #2a9d8f; font-weight: 700; }
  .f-images-replaced > .own > .asset { display: inline-block; }
  .f-inline-text > .own > .token:first-of-type { font-size: .72em; vertical-align: super; }
  .f-lists-counters > .own > .token { counter-increment: pair-item; }
  .f-lists-counters > .own > .token::before { content: counter(pair-item) '.'; color: #d62828; }
  .f-positioning > .own > .token:last-of-type { position: absolute; right: 4px; bottom: 4px; }
  .f-selectors-cascade:is(.node) > .own > .token:nth-of-type(2) { color: #c1121f; }
  @supports (display:grid) {
    .f-selectors-cascade { border-left-color: #06d6a0; border-right-color: #06d6a0; }
  }
  .f-tables > .own > .token { display: table-cell; vertical-align: middle; }

  body { display: block; padding: 0; font-size: 16px; white-space: normal; }
  .stage { display: flex; margin: 0; break-before: page; }
  .f-clip-mask {clip-path:polygon(5% 0,100% 8%,94% 100%,0 88%);}
  .f-paged-media {break-before:page;break-inside:avoid;}
</style>
</head>
<body>
  <div class="stage"><div class="node f-clip-mask f-paged-media"><div class="own"><span class="token">Ag</span><span class="token">Bb</span><img class="asset" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAECAIAAAA8r+mnAAAAIElEQVR42mM4IScHR3I9NnDEgFNCzu0EHN1ZJQJHOCUAni4lgeO2HLIAAAAASUVORK5CYII="></div></div></div>
  <div class="stage"><div class="node outer f-clip-mask"><div class="own"><span class="token">Ag</span><span class="token">Bb</span><img class="asset" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAECAIAAAA8r+mnAAAAIElEQVR42mM4IScHR3I9NnDEgFNCzu0EHN1ZJQJHOCUAni4lgeO2HLIAAAAASUVORK5CYII="></div></div></div>
  <div class="stage"><div class="node outer f-paged-media"><div class="own"><span class="token">Ag</span><span class="token">Bb</span><img class="asset" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAECAIAAAA8r+mnAAAAIElEQVR42mM4IScHR3I9NnDEgFNCzu0EHN1ZJQJHOCUAni4lgeO2HLIAAAAASUVORK5CYII="></div><div class="node inner f-clip-mask"><div class="own"><span class="token">A</span><span class="token">B</span><img class="asset" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAECAIAAAA8r+mnAAAAIElEQVR42mM4IScHR3I9NnDEgFNCzu0EHN1ZJQJHOCUAni4lgeO2HLIAAAAASUVORK5CYII="></div></div></div></div>
</body>
</html>
