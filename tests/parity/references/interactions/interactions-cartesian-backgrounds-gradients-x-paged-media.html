<!doctype html>
<html lang="en">

<meta charset="utf-8">
<title>backgrounds-gradients x paged-media interaction — standards-derived reference</title>
<style>
  @page { size: 192px 200px; margin: 0; }

  @font-face {
    font-family: MatrixSans;
    src: url('../../fonts/ParitySans.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
  }
  html { font-family: ParitySans; font-size: 16px; line-height: 1.2; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #ffffff; }
  body { padding: 16px; color: #17324d; font-size: 0; white-space: nowrap; }
  .stage {
    display: inline-flex;
    width: 156px;
    height: 164px;
    margin-right: 8px;
    align-items: center;
    justify-content: center;
    background: #f7fafc;
    border: 1px solid #cbd5e1;
    font-size: 16px;
    vertical-align: top;
  }
  .stage:last-child { margin-right: 0; }
  .node {
    width: 126px;
    height: 68px;
    padding: 7px;
    border: 2px solid #577590;
    background-color: #e7f5ff;
    color: #17324d;
  }
  .node.inner {
    width: 58px;
    height: 48px;
    padding: 5px;
  }
  .node.outer { height: 96px; }
  .own { height: 22px; white-space: nowrap; }
  .asset { display: none; width: 34px; height: 24px; object-fit: cover; object-position: 70% 50%; }
  .f-generated-content::before { content: '‹'; color: #d62828; font-weight: 700; }
  .f-generated-content::after { content: '›'; color: #2a9d8f; font-weight: 700; }
  .f-images-replaced > .own > .asset { display: inline-block; }
  .f-inline-text > .own > .token:first-of-type { font-size: .72em; vertical-align: super; }
  .f-lists-counters > .own > .token { counter-increment: pair-item; }
  .f-lists-counters > .own > .token::before { content: counter(pair-item) '.'; color: #d62828; }
  .f-positioning > .own > .token:last-of-type { position: absolute; right: 4px; bottom: 4px; }
  .f-selectors-cascade:is(.node) > .own > .token:nth-of-type(2) { color: #c1121f; }
  @supports (display:grid) {
    .f-selectors-cascade { border-left-color: #06d6a0; border-right-color: #06d6a0; }
  }
  .f-tables > .own > .token { display: table-cell; vertical-align: middle; }

  body { display: block; padding: 0; font-size: 16px; white-space: normal; }
  .stage { display: flex; margin: 0; break-before: page; }
  .f-backgrounds-gradients {background-image:linear-gradient(135deg,rgba(255,209,102,.82),rgba(6,214,160,.42));}
  .f-paged-media {break-before:page;break-inside:avoid;}

  /*
   * CSS Break 3 sections 2.1 and 5.3 require the forced break in the
   * fixed-size flex item to continue its overflowing child on the next page;
   * it does not remove the item's page-two background. Chromium clips that
   * background image only in the nested fragmentation paint path. Materialize
   * the same background as an independent sibling flex item, under the
   * unchanged box, so this reference records the specified paint without
   * relying on that bug. CSS Flexbox 1 section 10 explicitly keeps a forced
   * break inside one flex item from triggering a break inside sibling items.
   */
  .reference-gradient-layer {
    flex: 0 0 126px;
    width: 126px;
    height: 96px;
    margin-right: -126px;
    background-color: #e7f5ff;
    background-image: linear-gradient(135deg, rgba(255,209,102,.82), rgba(6,214,160,.42));
  }
  .reference-gradient-box {
    background-color: transparent;
    background-image: none;
  }
</style>
</head>
