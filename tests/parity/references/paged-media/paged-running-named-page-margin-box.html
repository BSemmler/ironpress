<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>running element named page margin box reference</title><style>
@page{size:184px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.cover{height:120px;background:#1d4ed8;break-after:page}.chapter{position:relative;height:120px}.header{position:absolute;top:2px;left:50%;transform:translateX(-50%);height:18px;font-size:12px;font-weight:700;line-height:18px;white-space:nowrap;background:#ffd166}.body{position:absolute;inset:22px 0 0;background:#16a34a}
</style></head><body><div class="cover"></div><section class="chapter"><div class="header">CHAPTER HEAD</div><div class="body"></div></section></body></html>
