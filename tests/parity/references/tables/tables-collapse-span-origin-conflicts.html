<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>resolved collapsed borders across spanning cells</title>
<style>
  @page { size: 416px 224px; margin: 0; }
  html, body { width: 416px; height: 224px; margin: 0; padding: 0; background: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  table { position: absolute; top: 24px; border-collapse: collapse; border-spacing: 0; table-layout: fixed; }
  td { width: 68px; height: 48px; padding: 0; border: 2px solid #212529; background: #edf6f9; }

  .columns { left: 24px; }
  .columns tr:first-child td { border-top: 10px solid #1d4ed8; }

  .rows { left: 224px; }
  .rows tr:first-child td:first-child { border-left: 10px solid #2a9d8f; }
</style>
</head>
<body>
  <table class="columns">
    <tr><td colspan="2"></td></tr>
    <tr><td></td><td></td></tr>
  </table>
  <table class="rows">
    <tr><td rowspan="2"></td><td></td></tr>
    <tr><td></td></tr>
  </table>
</body>
</html>
