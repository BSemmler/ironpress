<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>revert rolls back author opacity</title>
<style>
  @page { size: 224px 184px; margin: 0; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage {
    display: block;
    opacity: 0.2;
    opacity: revert;
    width: 180px;
    height: 140px;
    margin: 20px;
    padding: 10px;
    border: 3px solid #111111;
    background: #eeeeee;
  }
  .item { width: 70px; height: 45px; }
  .one { background: #1565c0; }
  .two { background: #0a7f2e; }
</style>
</head>
<body><div class="stage"><div class="item one"></div><div class="item two"></div></div></body>
</html>
