<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>invalid negative flex-grow preserves prior value</title>
<style>
  @page { size: 280px 144px; margin: 0; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage {
    display: flex;
    width: 240px;
    height: 100px;
    margin: 20px;
    padding: 10px;
    gap: 10px;
    border: 3px solid #111111;
    background: #eeeeee;
  }
  .grow {
    width: 40px;
    flex-grow: 1;
    flex-grow: -1;
    background: #0a7f2e;
  }
  .fixed { width: 45px; flex: none; background: #c62828; }
</style>
</head>
<body><div class="stage"><div class="grow"></div><div class="fixed"></div></div></body>
</html>
