<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 240px 184px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    .flex { display: flex; flex-wrap: wrap; align-content: flex-start; row-gap: 10px; column-gap: 10px; width: 220px; background: #eeeeee; border: 2px solid #222222; }
    .item { width: 60px; height: 50px; background: #2980b9; border: 2px solid #102a43; }
    .item:nth-child(3n+1) { background: #c0392b; }
    .item:nth-child(3n+2) { background: #27ae60; }
    /* CSS Flexbox §10: in a row container this propagates to its flex line. */
    .item:nth-child(4) { break-before: page; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
  </div>
</body>
</html>
