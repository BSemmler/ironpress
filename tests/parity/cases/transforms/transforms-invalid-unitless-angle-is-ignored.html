<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>invalid-unitless-angle-is-ignored</title>
<style>
  @page { size: 224px 144px; margin: 0; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage {
    position: relative;
    width: 180px;
    height: 100px;
    margin: 20px;
    background: #e8eaf6;
    border: 2px solid #1a237e;
  }
  .reference, .target {
    position: absolute;
    left: 48px;
    top: 25px;
    width: 80px;
    height: 50px;
  }
  .reference { background: #c62828; }
  .target {
    background: #0a7f2e;
    transform-origin: 0 0;
    transform: rotate(45);
  }
</style>
</head>
<body><div class="stage"><div class="reference"></div><div class="target"></div></div></body>
</html>
