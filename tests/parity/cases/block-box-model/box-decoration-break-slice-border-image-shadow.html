<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>slice border image and shadow continuation</title>
<style>
  @page { size: 320px 240px; margin: 0; }
  html, body { background: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .box {
    width: 240px;
    margin-left: 16px;
    padding: 12px;
    background: linear-gradient(to bottom, #fff0a8, #83e8e1);
    border: 12px solid #ff00ff;
    border-image: linear-gradient(to bottom, #d90429, #3a0ca3) 1;
    border-radius: 24px;
    box-shadow: 12px 10px 0 rgba(16, 24, 40, 0.55);
    box-decoration-break: slice;
  }
  .row { height: 64px; break-inside: avoid; }
  .a { background: #ff6b6b; }
  .b { background: #4d96ff; }
  .c { background: #6bcb77; }
  .d { background: #ffd93d; }
</style>
</head>
<body>
  <div class="box">
    <div class="row a"></div>
    <div class="row b"></div>
    <div class="row c"></div>
    <div class="row d"></div>
  </div>
</body>
</html>
