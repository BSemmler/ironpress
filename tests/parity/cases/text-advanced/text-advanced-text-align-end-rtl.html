<html lang="en">
<head>

<style>
  @page { size: 304px 112px; margin: 0; }

  html, body { background: #ffffff; }
  body { padding: 12px; }
  .box {
    width: 240px;
    border: 3px solid #111111;
    background: #f7e8e8;
    font-family: ParitySans;
    font-size: 24px;
    direction: rtl;
    text-align: end;
    color: #111111;
  }
</style>
</head>
<body>
  <div class="box">END</div>
</body>
</html>
