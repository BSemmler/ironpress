<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-layout-auto-text-exact-fit</title>
<style>
  @page { size: 280px 136px; margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #ffffff; }
  body {
    padding: 14px;
    color: #17202a;
    font: 16px/20px ParitySans;
  }
  table {
    width: auto;
    table-layout: auto;
    border-collapse: separate;
    border-spacing: 0;
  }
  td {
    padding: 7px 9px;
    border: 2px solid transparent;
    background: #eaf2f8;
    white-space: normal;
  }
  .suffix {
    color: #b03a2e;
  }
</style>
</head>
<body>
  <table>
    <tr>
      <td>alpha beta gamma<span class="suffix">!</span></td>
    </tr>
    <tr>
      <td>mono<span class="suffix">space</span></td>
    </tr>
  </table>
</body>
</html>
