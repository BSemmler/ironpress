<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fixed table unspecified columns ignore font size</title>
<style>
  @page { size: 272px 96px; margin: 0; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; }
  table {
    width: 240px;
    table-layout: fixed;
    border-collapse: collapse;
  }
  td { height: 64px; }
  .large { font-size: 64px; background: #f57c00; }
  .small { font-size: 8px; background: #1565c0; }
</style>
</head>
<body>
  <table>
    <tr><td class="large"></td><td class="small"></td></tr>
  </table>
</body>
</html>
