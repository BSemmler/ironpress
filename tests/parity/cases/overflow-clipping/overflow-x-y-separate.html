<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>overflow-x and overflow-y separate</title>
<style>
  @page { size: 304px 176px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 30px; }
  /* Because hidden is a scrollable overflow value, the visible y value
     computes to auto. Both axes therefore constrain the child. */
  .clip {
    overflow-x: hidden;
    overflow-y: visible;
    width: 160px;
    height: 110px;
    background: #eafaf1;
    border: 3px solid #145a32;
  }
  .child {
    width: 250px;
    height: 190px;
    background: #229954;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="clip">
      <div class="child"></div>
    </div>
  </div>
</body>
</html>
