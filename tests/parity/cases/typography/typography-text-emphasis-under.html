<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 336px 216px; margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  html { font-family: ParitySans, sans-serif; }
  body { padding: 16px; color: #111; font-size: 28px; }
  .under { line-height: 1.5; background: #e8f1fd; }
  .following { margin-top: 16px; line-height: 1.5; background: #fde8ec; }
  .em {
    color: #111;
    text-emphasis: filled dot #d7263d;
    text-emphasis-position: under right;
  }
</style>
</head>
<body>
<p class="under"><span class="em">重要事項</span></p>
<p class="following">後続行</p>
</body>
</html>
