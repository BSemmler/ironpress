<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 336px 192px; margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  html { font-family: ParitySans, sans-serif; }
  body { padding: 16px; color: #111; font-size: 28px; }
  .space { line-height: 1.5; white-space: pre; background: #e8f1fd; }
  .following { margin-top: 16px; line-height: 1.5; background: #fde8ec; }
  .em { text-emphasis: filled dot #d7263d; }
</style>
</head>
<body>
<p class="space"><span class="em"> </span></p>
<p class="following">後続行</p>
</body>
</html>
