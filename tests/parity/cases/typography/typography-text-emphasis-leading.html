<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 336px 216px; margin: 0 }
    * { box-sizing: border-box; margin: 0 }
    html { font-family: ParitySans }
    body { padding: 16px; color: #111; font-size: 28px }
    .line { width: 304px }
    .tight { line-height: 1.5; background: #fde8ec }
    .roomy { margin-top: 16px; line-height: 3; background: #e8f1fd }
    .em { text-emphasis: filled dot #d7263d; text-emphasis-position: over right }
  </style>
</head>
<body>
  <p class="line tight"><span class="em">重要事項</span></p>
  <p class="line roomy"><span class="em">重要事項</span></p>
</body>
</html>
