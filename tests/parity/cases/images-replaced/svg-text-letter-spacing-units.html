<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>svg text letter spacing units</title>
<style>
  @page { size: 352px 176px; margin: 0; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; }
  svg { display: block; background: #f4f1de; }
</style>
</head>
<body>
  <svg width="320" height="144" viewBox="0 0 320 144" xmlns="http://www.w3.org/2000/svg">
    <path d="M160 8V64M296 76V136" stroke="#e07a5f" stroke-width="2"></path>
    <g font-family="'Missing, Face', Parity\53 ans, serif" fill="#1d3557">
      <text x="160" y="48" text-anchor="middle" font-size="28" letter-spacing=".1em">office</text>
      <text x="296" y="116" text-anchor="end" font-size="28" style="letter-spacing: 2pt">A&#x200B;B</text>
    </g>
  </svg>
</body>
</html>
