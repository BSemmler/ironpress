<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>probe border box</title>
<style>
  @page { size: 280px 144px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* Exact-output canary: one known thick solid border. A mismatch measures
     emitted PDF stroke/edge coverage; it is not, by itself, evidence that the
     CSS border-box geometry is wrong. */
  .box {
    width: 200px;
    height: 140px;
    background-color: transparent;
    border: 12px solid #2e7d32;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
