<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>break-after avoid keeps the next box</title>
  <style>
    @page { size: 160px 120px; margin: 0 }
    * { box-sizing: border-box; margin: 0 }
    .spacer { height: 72px; background: #bfdbfe }
    .head { height: 24px; background: #f59e0b; break-after: avoid }
    .next { height: 32px; background: #22c55e }
  </style>
</head>
<body><div class="spacer"></div><div class="head"></div><div class="next"></div></body>
</html>
