<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>page margin box after synthetic weight</title>
  <style>
    @page {
      size: 192px 192px;
      margin: 32px 0 0;
      @top-center {
        content: "ALPHA ALPHA";
        color: #ffffff;
        background: #111827;
        font-family: ParitySans;
        font-size: 24px;
        font-weight: normal;
        line-height: 32px;
      }
    }
    html {
      color: #111827;
      font-family: ParitySans;
      line-height: 1.5;
    }
    * { margin: 0; box-sizing: border-box; }
    h2 {
      height: 24px;
      color: #111827;
      background: #ffd166;
      font-size: 12px;
      font-weight: bold;
      line-height: 24px;
    }
    .body { height: 136px; background: #bfdbfe; }
  </style>
</head>
<body>
  <h2>SYNTHETIC BOLD</h2>
  <div class="body"></div>
</body>
</html>
