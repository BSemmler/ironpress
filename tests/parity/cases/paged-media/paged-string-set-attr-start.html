<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>string-set attr start margin header</title><style>
@page{size:192px 136px;margin:24px 0 0 0;@top-center{content:string(section,start);font-weight:400}}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
h2{string-set:section attr(data-title);height:20px;background:#ffd166;font-size:12px;font-weight:700}.body{height:100px;background:#bfdbfe;break-before:page}
</style></head><body><h2 data-title="ALPHA">ignored text</h2><div class="body"></div></body></html>
