<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>root grid page carrier stays on one page</title>
<style>
@page { size: 320px 160px; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 320px; height: 160px; background: #fff; }
body { display: grid; grid-template-columns: repeat(3, 80px); grid-template-rows: 80px; gap: 8px; padding: 16px; }
.item { width: 80px; height: 80px; border: 4px solid #111827; }
.a { background: #ef233c; }
.b { background: #06d6a0; }
.c { background: #2563eb; }
</style>
</head>
<body><div class="item a"></div><div class="item b"></div><div class="item c"></div></body>
</html>
