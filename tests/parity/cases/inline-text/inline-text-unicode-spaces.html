<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 320px 176px; margin: 0; }
  html { font-family: ParityMono; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; color: #102a43; font-size: 16px; }
  .row { height: 32px; white-space: normal; }
  .mark { color: #d7263d; }
</style>
</head>
<body>
  <div class="row">X&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="mark">Y</span></div>
  <div class="row">X <span class="mark">Y</span></div>
  <div class="row">X&ensp;&ensp;&ensp;<span class="mark">Y</span></div>
  <div class="row">X&emsp;&emsp;<span class="mark">Y</span></div>
</body>
</html>
