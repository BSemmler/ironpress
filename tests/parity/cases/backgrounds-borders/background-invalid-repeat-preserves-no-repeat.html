<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>invalid background-repeat preserves no-repeat</title>
<style>
  @page { size: 224px 160px; margin: 0; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .target {
    width: 180px;
    height: 120px;
    margin: 20px;
    border: 3px solid #111111;
    background-color: #eeeeee;
    background-image: linear-gradient(135deg, #c62828 0 50%, #1565c0 50% 100%);
    background-size: 36px 36px;
    background-repeat: no-repeat;
    background-repeat: definitely-invalid;
  }
</style>
</head>
<body><div class="target"></div></body>
</html>
