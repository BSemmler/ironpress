<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>filter chain order contrast blur</title>
<style>
  @page { size: 240px 160px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .frame {
    width: 240px;
    height: 160px;
    padding: 24px;
    background: #f5f5f5;
  }
  .sample {
    position: relative;
    display: block;
    width: 192px;
    height: 48px;
  }
  .sample > i {
    position: absolute;
    display: block;
    width: 96px;
    height: 24px;
  }
  .red { left: 0; top: 0; background: #ff0000; }
  .green { right: 0; top: 0; background: #00ff00; }
  .blue { left: 0; bottom: 0; background: #0000ff; }
  .yellow { right: 0; bottom: 0; background: #ffff00; }
  .a {
    filter: contrast(5) blur(8px);
  }
  .b {
    margin-top: 16px;
    filter: blur(8px) contrast(5);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="sample a">
      <i class="red"></i><i class="green"></i>
      <i class="blue"></i><i class="yellow"></i>
    </div>
    <div class="sample b">
      <i class="red"></i><i class="green"></i>
      <i class="blue"></i><i class="yellow"></i>
    </div>
  </div>
</body>
</html>
