language = "C"
pragma_once = true
cpp_compat = true
autogen_warning = "// Generated by cbindgen. Update Rust declarations instead of editing this file."
documentation_style = "c99"
documentation_length = "full"
line_length = 100
tab_width = 4
style = "type"
sort_by = "Name"
usize_is_size_t = true

[export]
include = [
    "IronpressBuffer",
    "IronpressBytes",
    "IronpressConverter",
    "IronpressError",
    "IronpressStatus",
    "IRONPRESS_ABI_VERSION",
    "IRONPRESS_PAGE_SIZE_A4",
    "IRONPRESS_PAGE_SIZE_LEGAL",
    "IRONPRESS_PAGE_SIZE_LETTER",
    "IRONPRESS_STATUS_CSS",
    "IRONPRESS_STATUS_FONT",
    "IRONPRESS_STATUS_INTERNAL",
    "IRONPRESS_STATUS_INVALID_ARGUMENT",
    "IRONPRESS_STATUS_INVALID_ENUM",
    "IRONPRESS_STATUS_INVALID_HANDLE",
    "IRONPRESS_STATUS_INVALID_UTF8",
    "IRONPRESS_STATUS_IO",
    "IRONPRESS_STATUS_LAYOUT",
    "IRONPRESS_STATUS_OK",
    "IRONPRESS_STATUS_OUTPUT_NOT_EMPTY",
    "IRONPRESS_STATUS_PARSE",
    "IRONPRESS_STATUS_RENDER",
    "IRONPRESS_STATUS_SECURITY",
]

[fn]
must_use = "IRONPRESS_NODISCARD"
sort_by = "Name"

[parse]
parse_deps = false
